name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release Package
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install npm dependencies
        run: npm ci

      - name: Run JavaScript unit tests
        run: npm test

      - name: Run Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Windows Code Signing Certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "certificates"

          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "Decoding certificate from WINDOWS_CERTIFICATE secret..."
            $certPath = "$env:TEMP\cert.pfx"
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $secPassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPassword
            Remove-Item $certPath -Force
            Write-Host "Imported secret certificate with thumbprint: $($cert.Thumbprint)"
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Export-Certificate -Cert $cert -FilePath "certificates/Nada-PublicCert.cer" | Out-Null
          } else {
            Write-Host "No WINDOWS_CERTIFICATE provided. Generating self-signed code signing certificate..."
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Ananda, O=Nada Desktop Player" `
              -KeySpec Signature `
              -KeyUsage DigitalSignature `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)
            Write-Host "Generated certificate with thumbprint: $($cert.Thumbprint)"
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Export-Certificate -Cert $cert -FilePath "certificates/Nada-PublicCert.cer" | Out-Null
          }

      - name: Build Tauri app & create GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nada v__VERSION__'
          releaseBody: |
            ### Nada v__VERSION__

            Lightweight, ad-free desktop music and video player for Windows.

            #### Assets included:
            - **Installer (NSIS Setup)**: `Nada___VERSION___x64-setup.exe`
            - **Portable Version**: `Nada-v__VERSION__-windows-portable.zip`
            - **Public Certificate**: `Nada-PublicCert.cer`
            - **Checksums**: `SHA256SUMS.txt`
          releaseDraft: ${{ github.event.inputs.release_draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}

      - name: Sign Binaries and Installer with SignTool
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Write-Host "Using SignTool: $signtool"
          $thumbprint = $env:CERT_THUMBPRINT

          $targets = @()
          $exe = "src-tauri/target/release/nada.exe"
          if (Test-Path $exe) { $targets += $exe }

          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsis) { $targets += $nsis.FullName }

          foreach ($target in $targets) {
            Write-Host "Signing $target with timestamp..."
            & $signtool sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Nada Desktop Player" $target
            Get-AuthenticodeSignature -FilePath $target | Format-List
          }

      - name: Package Portable Executable & Generate Checksums
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          if (-not $version) {
            $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          }
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path "release-extra"

          # 1. Package standalone portable binary
          $portableFolder = "release-extra/Nada-v$version-portable"
          New-Item -ItemType Directory -Force -Path $portableFolder
          Copy-Item "src-tauri/target/release/nada.exe" "$portableFolder/nada.exe"
          Copy-Item "LICENSE" "$portableFolder/LICENSE" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "$portableFolder/README.md" -ErrorAction SilentlyContinue
          if (Test-Path "certificates/Nada-PublicCert.cer") {
            Copy-Item "certificates/Nada-PublicCert.cer" "$portableFolder/Nada-PublicCert.cer"
          }

          Compress-Archive -Path "$portableFolder/*" -DestinationPath "release-extra/Nada-v$version-windows-portable.zip" -Force
          Remove-Item -Recurse -Force $portableFolder

          # 2. Copy Public Certificate to release assets
          if (Test-Path "certificates/Nada-PublicCert.cer") {
            Copy-Item "certificates/Nada-PublicCert.cer" "release-extra/Nada-PublicCert.cer"
          }

          # 3. Collect generated NSIS installer for SHA256 checksum calculations
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          # 4. Compute SHA256 checksums
          $checksumList = @()
          if ($nsis) {
            $hashNsis = (Get-FileHash -Path $nsis.FullName -Algorithm SHA256).Hash.ToLower()
            $checksumList += "$hashNsis  $($nsis.Name)"
          }

          $portableZip = Get-Item "release-extra/Nada-v$version-windows-portable.zip"
          $hashZip = (Get-FileHash -Path $portableZip.FullName -Algorithm SHA256).Hash.ToLower()
          $checksumList += "$hashZip  $($portableZip.Name)"

          $checksumList | Out-File -FilePath "release-extra/SHA256SUMS.txt" -Encoding utf8

      - name: Upload Portable Zip, Cert, and Checksums to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }}
          files: |
            release-extra/Nada-*-windows-portable.zip
            release-extra/Nada-PublicCert.cer
            release-extra/SHA256SUMS.txt
