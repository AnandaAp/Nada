<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-backdrop" aria-hidden="true"></div>
  <header>
    <div class="brandrow">
      <div class="brand">nada<span>.</span><span class="brand-sub">STUDIO</span></div>
      <button id="homeBtn" class="homebtn" aria-label="Buka beranda">Beranda</button>
    </div>
    <div class="searchwrap">
      <input id="search" type="text" aria-label="Cari lagu atau video" placeholder="Cari lagu atau video…" autocomplete="off" spellcheck="false" />
      <button id="clearSearch" class="hidden" title="Hapus pencarian" aria-label="Hapus pencarian">×</button>
      <button id="searchBtn" title="Cari" aria-label="Cari">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </div>
    <nav class="tabs">
      <button id="tabTracks" class="tab active">Lagu</button>
      <button id="tabVideos" class="tab">Video</button>
    </nav>
  </header>

  <main id="main">
    <div id="status" class="status hidden"></div>
    <section id="home" class="home" aria-label="Rekomendasi musik">
      <div class="homehead">
        <div><p class="eyebrow">DISCOVER</p><h1>Mau dengerin apa?</h1></div>
        <button id="refreshHome" class="chip">Refresh</button>
      </div>
      <div id="homeSections"></div>
    </section>
    <div id="collectionHead" class="collectionhead hidden">
      <button id="backHome">← Beranda</button>
      <h1 id="collectionTitle"></h1>
    </div>
    <ul id="results" class="results hidden"></ul>
    <div id="empty" class="empty hidden"><p>Belum ada lagu di sini.</p></div>
  </main>

  <section id="queuePanel" class="queue hidden">
    <div class="queue-head">
      <span>Antrean</span>
      <button id="queueClose" aria-label="Tutup antrean">✕</button>
    </div>
    <ul id="queueList"></ul>
  </section>

  <div id="videoStage" class="stage hidden">
    <div id="ytPlayer" class="hidden"></div>
    <video id="video" playsinline></video>
    <button id="pipBtn" class="stage-pip-btn" title="Picture in Picture" aria-label="Picture in Picture">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <rect x="12" y="10" width="8" height="6" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <audio id="audio"></audio>

  <footer class="player">
    <div class="progressrow">
      <span id="curTime">0:00</span>
      <input id="progress" type="range" min="0" max="1000" value="0" />
      <span id="durTime">0:00</span>
    </div>
    <div class="playerrow">
      <img id="pCover" class="pcover hidden" alt="" />
      <div class="pmeta">
        <div id="pTitle" class="ptitle">Belum muter apa-apa</div>
        <div id="pArtist" class="partist">Pilih lagu untuk mulai</div>
      </div>
      <div class="pcontrols">
        <button id="prevBtn" title="Sebelumnya" aria-label="Sebelumnya">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="playBtn" class="play" title="Play / Pause" aria-label="Play / Pause">
          <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" class="hidden" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        </button>
        <button id="nextBtn" title="Berikutnya" aria-label="Berikutnya">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="pextras">
        <div class="pmodes">
          <button id="repeatBtn" class="iconbtn" title="Ulangi" aria-label="Ulangi">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 1l4 4-4 4"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 23l-4-4 4-4"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            <span id="repeatBadge" class="repeat-badge hidden">1</span>
          </button>
          <button id="shuffleBtn" class="iconbtn" title="Acak antrean" aria-label="Acak antrean">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5"/>
              <path d="M4 20L21 3"/>
              <path d="M21 16v5h-5"/>
              <path d="M15 15l6 6"/>
              <path d="M4 4l5 5"/>
            </svg>
          </button>
        </div>
        <div class="pvolume-wrap">
          <button id="videoBtn" class="chip hidden" title="Mode video">Video</button>
          <input id="volume" type="range" min="0" max="100" value="80" title="Volume" />
          <button id="queueBtn" class="iconbtn" title="Antrean" aria-label="Antrean">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v6.5a2.5 2.5 0 1 0 2 2.45V8h3V6h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
