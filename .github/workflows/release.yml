name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release Package
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Windows Code Signing Certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "certificates"

          if ($env:WINDOWS_CERTIFICATE) {
            Write-Host "Decoding certificate from WINDOWS_CERTIFICATE secret..."
            $certPath = "$env:TEMP\cert.pfx"
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim()))
            $secPassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD.Trim() -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPassword
            Remove-Item $certPath -Force
            Write-Host "Imported secret certificate with thumbprint: $($cert.Thumbprint)"
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Export-Certificate -Cert $cert -FilePath "certificates/Nada-PublicCert.cer" | Out-Null
          } else {
            Write-Host "No WINDOWS_CERTIFICATE provided. Generating self-signed code signing certificate..."
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=Ananda, O=Nada Desktop Player" `
              -KeySpec Signature `
              -KeyUsage DigitalSignature `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)
            Write-Host "Generated certificate with thumbprint: $($cert.Thumbprint)"
            "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Export-Certificate -Cert $cert -FilePath "certificates/Nada-PublicCert.cer" | Out-Null
          }

      - name: Build Pure Rust Desktop Release Binary
        env:
          NADA_JNN_KEY: ${{ secrets.NADA_JNN_KEY }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Resolve Version & Build NSIS Installer
        shell: pwsh
        run: |
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $confVersion = $Matches[1]
          } else {
            throw "Failed to parse version from src-tauri/Cargo.toml"
          }

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".StartsWith("v")) {
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart("v")
          } else {
            $version = $confVersion
            $tagName = "v$confVersion"
          }
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path "release-extra"

          # Sign standalone nada.exe BEFORE embedding into NSIS installer so installed binary is signed too
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          $thumbprint = $env:CERT_THUMBPRINT
          $exe = (Resolve-Path "src-tauri/target/release/nada.exe").Path
          Write-Host "Signing $exe with timestamp..."
          & $signtool sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Nada Desktop Player" $exe
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed on $exe with exit code $LASTEXITCODE"
          }

          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            choco install nsis -y
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }

          $iconPath = (Resolve-Path "src-tauri/icons/icon.ico").Path
          $outSetup = Join-Path (Resolve-Path "release-extra").Path "Nada_${version}_x64-setup.exe"
          & $makensis "/DVERSION=$version" "/DEXE_PATH=$exe" "/DICON_PATH=$iconPath" "/DOUT_FILE=$outSetup" "scripts/installer.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

          Write-Host "Signing $outSetup with timestamp..."
          & $signtool sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Nada Desktop Player Setup" $outSetup
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed on $outSetup with exit code $LASTEXITCODE"
          }
          Get-AuthenticodeSignature -FilePath $outSetup | Format-List

      - name: Package Signed Assets & Generate Checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION

          # 1. Package signed standalone portable binary
          $portableFolder = "release-extra/Nada-v$version-portable"
          New-Item -ItemType Directory -Force -Path $portableFolder
          Copy-Item "src-tauri/target/release/nada.exe" "$portableFolder/nada.exe"
          Copy-Item "LICENSE" "$portableFolder/LICENSE" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "$portableFolder/README.md" -ErrorAction SilentlyContinue
          if (Test-Path "certificates/Nada-PublicCert.cer") {
            Copy-Item "certificates/Nada-PublicCert.cer" "$portableFolder/Nada-PublicCert.cer"
          }

          Compress-Archive -Path "$portableFolder/*" -DestinationPath "release-extra/Nada-v$version-windows-portable.zip" -Force
          Remove-Item -Recurse -Force $portableFolder

          # 2. Copy Public Certificate to release assets
          if (Test-Path "certificates/Nada-PublicCert.cer") {
            Copy-Item "certificates/Nada-PublicCert.cer" "release-extra/Nada-PublicCert.cer"
          }

          # 3. Compute SHA256 checksums on signed artifacts
          $checksumList = @()
          $nsis = Get-ChildItem -Path "release-extra/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $hashNsis = (Get-FileHash -Path $nsis.FullName -Algorithm SHA256).Hash.ToLower()
            $checksumList += "$hashNsis  $($nsis.Name)"
          }

          $portableZip = Get-Item "release-extra/Nada-v$version-windows-portable.zip"
          $hashZip = (Get-FileHash -Path $portableZip.FullName -Algorithm SHA256).Hash.ToLower()
          $checksumList += "$hashZip  $($portableZip.Name)"

          $checksumList | Out-File -FilePath "release-extra/SHA256SUMS.txt" -Encoding utf8

      - name: Create GitHub Release & Upload Signed Assets
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nada ${{ env.RELEASE_TAG }}
          draft: ${{ github.event.inputs.release_draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          body: |
            ### Nada ${{ env.RELEASE_TAG }}

            Pure-Rust ultra-lightweight desktop music and video player for Windows (zero WebView).

            #### Assets included:
            - **Installer (NSIS Setup, Signed)**: `Nada_${{ env.RELEASE_VERSION }}_x64-setup.exe`
            - **Portable Version (Signed)**: `Nada-v${{ env.RELEASE_VERSION }}-windows-portable.zip`
            - **Public Certificate**: `Nada-PublicCert.cer`
            - **Checksums**: `SHA256SUMS.txt`
          files: |
            release-extra/*.exe
            release-extra/Nada-*-windows-portable.zip
            release-extra/Nada-PublicCert.cer
            release-extra/SHA256SUMS.txt
